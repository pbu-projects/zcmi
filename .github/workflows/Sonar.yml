name: Sonar
on: [pull_request, workflow_dispatch]
jobs:
  build:
    name: Run Sonar Scan
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      ZCMI_SANDBOX_URL: ${{ secrets.ZCMI_SANDBOX_URL }}
      ZCMI_ADMIN_EMAIL: ${{ secrets.ZCMI_ADMIN_EMAIL }}
      ZCMI_ADMIN_TOKEN: ${{ secrets.ZCMI_ADMIN_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: graalvm/setup-graalvm@f70bc8032f90a104502824a54bcb94b6f01715bc # v1.6.8
        with:
          java-version: '21'
          distribution: 'graalvm'
      - name: call gradle to run tests and then compile native image
        run: ./gradlew test sonar
